# HelpDesk — dev con HMR (automatiza pnpm web dentro de Docker)
# Uso NUBE (default, usa .env con https://stzcqex...):
#   docker compose -f docker-compose.dev.yml up --build          # HMR en http://localhost:19006
#   pnpm docker:dev        # alias
# Uso LOCAL (Supabase en Docker via `npx supabase start`):
#   pnpm supa:start        # levanta stack Supabase local (54321/54322/54323/54324)
#   pnpm supa:env          # genera .env.local/.env con URL+ANON_KEY locales
#   pnpm dev:local         # supa:start + supa:env + web-dev contra http://host.docker.internal:54321
#   docker compose -f docker-compose.dev.yml up --build --watch  # + sync con Compose Watch
#   docker compose -f docker-compose.dev.yml down
#   pnpm supa:stop         # apaga stack Supabase local
# Para prod sigue usando: docker compose up --build  (nginx en http://localhost:3000)
services:
  web-dev:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
    ports:
      - "19006:19006" # Expo web
      - "19000:19000" # Expo devtools (opcional)
    env_file:
      - .env
    extra_hosts:
      # Permite que el contenedor alcance Supabase local en el host (127.0.0.1:54321)
      # Uso local: EXPO_PUBLIC_SUPABASE_URL=http://host.docker.internal:54321
      - "host.docker.internal:host-gateway"
    environment:
      EXPO_PUBLIC_SUPABASE_URL: ${EXPO_PUBLIC_SUPABASE_URL}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${EXPO_PUBLIC_SUPABASE_ANON_KEY}
      # Necesario para que Metro detecte cambios dentro del bind mount
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      # Código fuente con HMR (cambias archivo y recarga sin rebuild)
      - ./apps/web:/app/apps/web
      - ./shared:/app/shared
      - ./package.json:/app/package.json:ro
      - ./pnpm-workspace.yaml:/app/pnpm-workspace.yaml:ro
      - ./pnpm-lock.yaml:/app/pnpm-lock.yaml:ro
      - ./tsconfig.json:/app/tsconfig.json:ro
      # Evita pisar node_modules del contenedor con los del host
      - web_dev_node_modules:/app/node_modules
      - web_dev_app_node_modules:/app/apps/web/node_modules
      - web_dev_shared_node_modules:/app/shared/node_modules
      # Expo cache
      - web_dev_expo:/app/apps/web/.expo
    restart: unless-stopped
    # Healthcheck simple: espera a que Expo responda
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:19006/ | grep -qi '<html' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

    # Compose Watch: sincroniza cambios sin rebuild manual (requiere `docker compose --watch`)
    develop:
      watch:
        - action: sync
          path: ./apps/web
          target: /app/apps/web
          ignore:
            - node_modules/
            - dist/
            - .expo/
        - action: sync
          path: ./shared
          target: /app/shared
        # si cambias lockfile, rebuild
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./pnpm-lock.yaml
        - action: rebuild
          path: ./apps/web/Dockerfile.dev

volumes:
  web_dev_node_modules:
  web_dev_app_node_modules:
  web_dev_shared_node_modules:
  web_dev_expo:
