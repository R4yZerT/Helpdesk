# Configuracion de Supabase (CLI / GitHub import).
# Reference: https://supabase.com/docs/reference/cli/config
project_id = "helpdesk"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
# Claves de desarrollo locales. En produccion Supabase las gestiona.
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:19006"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

[storage]
enabled = true
file_size_limit = "20MB"

[functions]
enabled = true
verify_jwt = true
include_import_map = true

[analytics]
enabled = true